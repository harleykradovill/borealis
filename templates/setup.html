<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borealis | Setup</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/borealis_small.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/setup.css') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app-shell">
      <main id="content" class="content setup-content" tabindex="-1">
        <section class="setup-wizard">
          <img src="../assets/images/borealis.png" alt="" class="setup-icon" />
          <section class="setup-page active" data-page="1">
            <h2 class="setup-heading">General Settings</h2>

            <div class="form-grid">
              <div class="form-field">
                <label for="hour-format">Hour Format</label>
                <select id="hour-format" name="hour_format">
                  <option value="24">24 Hours</option>
                  <option value="12" selected>12 Hours</option>
                </select>
              </div>

              <div class="form-field">
                <label for="language">Language</label>
                <select id="language" name="language">
                  <option value="en">English</option>
                </select>
              </div>

              <div class="form-field">
                <label for="sync-interval">Sync Interval</label>
                <select id="sync-interval" name="sync_interval">
                  <option value="1800" selected>30 Minutes</option>
                  <option value="3600">1 Hour</option>
                  <option value="43200">12 Hours</option>
                </select>
              </div>
            </div>

            <nav class="page-navigation">
              <button class="btn placeholder" tabindex="-1">XXXX</button>
              <div class="setup-progress" id="progress-indicator">
                <div class="progress-dot active" data-page="1"></div>
                <div class="progress-dot" data-page="2"></div>
                <div class="progress-dot" data-page="3"></div>
              </div>
              <button type="button" class="btn" id="page1-next">Next</button>
            </nav>
          </section>
          <section class="setup-page" data-page="2">
            <h2 class="setup-heading">Jellyfin Server</h2>

            <div class="form-grid">
              <div class="form-field">
                <label for="jf-first-host">Host</label>
                <input
                  id="jf-first-host"
                  type="text"
                  inputmode="url"
                  placeholder="127.0.0.1"
                />
              </div>

              <div class="form-field">
                <label for="jf-first-port">Port</label>
                <input
                  id="jf-first-port"
                  type="text"
                  inputmode="numeric"
                  placeholder="8096"
                />
              </div>

              <div class="form-field full-width">
                <label for="jf-first-api-key">API Key</label>
                <input
                  id="jf-first-api-key"
                  type="text"
                  autocomplete="off"
                  placeholder="Enter your API key"
                />
              </div>

              <div class="form-field full-width">
                <button type="button" id="jf-first-test-btn" class="btn">
                  Test Connection
                </button>
              </div>
            </div>

            <nav class="page-navigation">
              <button type="button" class="btn btn-ghost" id="page2-prev">Back</button>
              <div class="setup-progress" id="progress-indicator">
                <div class="progress-dot active" data-page="1"></div>
                <div class="progress-dot" data-page="2"></div>
                <div class="progress-dot" data-page="3"></div>
              </div>
              <button type="button" class="btn" id="page2-next" disabled>Next</button>
            </nav>
          </section>

          <section class="setup-page" data-page="3">
            <h2 class="setup-heading">Review Server</h2>

            <div class="server-info-display" id="server-info-display">
              <div class="info-row">
                <span class="info-label">Server Name</span>
                <span class="info-value" id="server-name-display">Loading…</span>
              </div>
              <div class="info-row">
                <span class="info-label">Server Version</span>
                <span class="info-value" id="server-version-display">Loading…</span>
              </div>
            </div>

            <div class="libraries-tracking" id="libraries-tracking">
              <h2>Available Libraries</h2>
              <div id="libraries-list"></div>
              <div id="libraries-empty" class="libraries-placeholder" hidden>
                No libraries found
              </div>
            </div>

            <nav class="page-navigation">
              <button type="button" class="btn btn-ghost" id="page3-prev">Back</button>
              <div class="setup-progress" id="progress-indicator">
                <div class="progress-dot active" data-page="1"></div>
                <div class="progress-dot" data-page="2"></div>
                <div class="progress-dot" data-page="3"></div>
              </div>
              <button type="button" class="btn" id="page3-finish">Finish Setup</button>
            </nav>
          </section>

          <section class="setup-page" data-page="sync">
            <div class="sync-status">
              <div class="jf-sync-spinner"></div>
              <p id="jf-first-sync-text" class="sync-text">
                Performing initial sync with Jellyfin
              </p>
            </div>
          </section>
        </section>
      </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="../static/js/toast.js"></script>
    <script src="../static/js/setup.js"></script>
    <script src="../static/js/site.js"></script>
  </body>
</html>
