<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borealis | Libraries</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/borealis_small.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/libraries.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      {% include '_sidebar.html' %}
      <main id="content" class="content" tabindex="-1" role="main">
        <section id="table-section" hidden>
          <div id="libraries-empty" class="settings-placeholder" hidden>
            <p>No libraries found.</p>
          </div>

          <section id="libraries-table-container" hidden>
            <table id="libraries-table" class="libraries-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Type</th>
                  <th>Total Time</th>
                  <th>Size</th>
                  <th>Total Playback</th>
                  <th>Last Played</th>
                </tr>
              </thead>
              <tbody id="libraries-tbody"></tbody>
            </table>
          </section>
        </section>

        <section id="charts-section">
          <div class="libraries-chart-group">
            <div class="chart-card">
              <h1>Files</h1>
              <canvas id="files-doughnut"></canvas>

              <div id="libraries-chart-empty-files" class="settings-placeholder" hidden>
                <p>No data to display.</p>
              </div>
            </div>
          </div>

          <div class="libraries-chart-group">
            <div class="chart-card">
              <h1>Plays</h1>
              <canvas id="plays-doughnut"></canvas>

              <div id="libraries-chart-empty-plays" class="settings-placeholder" hidden>
                <p>No data to display.</p>
              </div>
            </div>
          </div>
        </section>

        <div class="libraries-chart-group">
          <div class="chart-card">
            <h1>Items Added in the last 30 Days</h1>
            <canvas id="item-line" width="1400" height="360"></canvas>
          </div>
        </div>
      </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../static/js/toast.js"></script>
    <script src="../static/js/site.js"></script>
    <script src="../static/js/libraries.js"></script>
  </body>
</html>
