<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borealis | Playback Activity</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/borealis_small.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/playbackactivity.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      {% include '_sidebar.html' %}
      <main id="content" class="content" tabindex="-1" role="main">
        <div id="activitylog-empty" class="settings-placeholder" hidden>
          <p>No playback activity available.</p>
        </div>

        <div id="activitylog-container" hidden>
          <div style="overflow-x: auto">
            <table
              id="activitylog-table"
              class="table"
              style="width: 100%; border-collapse: collapse"
            >
              <thead>
                <tr>
                  <th style="text-align: left; padding: 0.5rem">
                    <span class="activitylog-user-heading">
                      <span>User</span>
                      <button
                        id="activitylog-user-filter-btn"
                        class="activitylog-filter-btn"
                        type="button"
                      >
                        <img
                          src="../assets/icons/filter_off.svg"
                          alt=""
                          class="activitylog-filter-icon"
                        />
                      </button>
                    </span>
                  </th>
                  <th style="text-align: left; padding: 0.5rem">Type</th>
                  <th style="text-align: left; padding: 0.5rem">Media Name</th>
                  <th style="text-align: right; padding: 0.5rem">Date</th>
                </tr>
              </thead>
              <tbody id="activitylog-tbody"></tbody>
            </table>
          </div>

          <div id="activitylog-user-filter-menu" class="activitylog-filter-menu" hidden>
            <div class="activitylog-filter-title">Filter by User</div>
            <div
              id="activitylog-user-filter-options"
              class="activitylog-filter-options"
            ></div>
          </div>

          <nav
            id="activitylog-pagination"
            class="pagination"
            role="navigation"
            style="
              margin-top: 1rem;
              display: flex;
              gap: 0.5rem;
              align-items: center;
              flex-wrap: wrap;
            "
          >
            <button id="activitylog-first" class="btn btn-ghost" type="button" disabled>
              &laquo;
            </button>
            <button id="activitylog-prev" class="btn btn-ghost" type="button" disabled>
              &lt;
            </button>

            <div
              id="activitylog-pages"
              style="display: flex; gap: 0.35rem; align-items: center"
            ></div>

            <button id="activitylog-next" class="btn btn-ghost" type="button" disabled>
              &gt;
            </button>
            <button id="activitylog-last" class="btn btn-ghost" type="button" disabled>
              &raquo;
            </button>

            <div
              style="margin-left: auto; color: var(--text-muted); font-size: 0.95rem"
            >
              <span id="activitylog-meta"
                >Page <span id="activitylog-page-num">1</span></span
              >
            </div>
          </nav>
        </div>
      </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="../static/js/toast.js"></script>
    <script src="../static/js/site.js"></script>
    <script src="../static/js/playbackactivity.js"></script>
  </body>
</html>
