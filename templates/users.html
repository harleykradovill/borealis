<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borealis | Users</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../assets/images/borealis_small.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/site.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/users.css') }}"
    />
  </head>
  <body>
    <div class="app-shell">
      {% include '_sidebar.html' %}
      <main id="content" class="content" tabindex="-1" role="main">
        <div
          id="users-container"
          hidden
          style="max-width: 1500px; margin: 0 auto"
        >
          <table id="users-table" class="users-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Last Watched</th>
                <th>Last Device</th>
                <th class="align-right">Total Plays</th>
                <th class="align-right">Watch Time</th>
                <th class="align-right">Last Seen</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>

        <div id="users-empty" class="settings-placeholder">
          <p>No users found.</p>
        </div>
      </main>
    </div>

    <div id="toast-container" class="toast-container" role="status"></div>

    <script src="../static/js/toast.js"></script>
    <script src="../static/js/site.js"></script>
    <script src="../static/js/users.js"></script>
  </body>
</html>
