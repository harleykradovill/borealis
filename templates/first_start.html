<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borealis | First Start</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../assets/images/borealis_small.png"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/site.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/first_start.css') }}"
    />
  </head>
  <body>
    <main id="content" class="content" tabindex="-1">
      <section class="first-start">
        <div class="first-start-progress" id="progress-indicator">
          <div class="progress-dot active" data-page="1"></div>
          <div class="progress-dot" data-page="2"></div>
          <div class="progress-dot" data-page="3"></div>
        </div>
        <div class="first-start-pages" id="pages-container">
          <div class="first-start-page active" data-page="1">
            <div class="page-content">
              <div class="page-header">
                <h2>General Settings</h2>
              </div>

              <div class="form-grid">
                <div class="form-field">
                  <label for="hour-format">Hour Format</label>
                  <select id="hour-format" name="hour_format">
                    <option value="24">24 Hours</option>
                    <option value="12" selected>12 Hours</option>
                  </select>
                </div>

                <div class="form-field">
                  <label for="language">Language</label>
                  <select id="language" name="language">
                    <option value="en">English</option>
                  </select>
                </div>

                <div class="form-field">
                  <label for="sync-interval">Sync Interval</label>
                  <select id="sync-interval" name="sync_interval">
                    <option value="1800" selected>30 Minutes</option>
                    <option value="3600">1 Hour</option>
                    <option value="43200">12 Hours</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="page-navigation">
              <div class="page-nav-spacer"></div>
              <button type="button" class="btn" id="page1-next">Next</button>
            </div>
          </div>
          <div class="first-start-page" data-page="2">
            <div class="page-content">
              <div class="page-header">
                <h2>Jellyfin Server</h2>
              </div>

              <div class="form-grid">
                <div class="form-field">
                  <label for="jf-first-host">Host</label>
                  <input
                    id="jf-first-host"
                    type="text"
                    inputmode="url"
                    placeholder="127.0.0.1"
                  />
                </div>

                <div class="form-field">
                  <label for="jf-first-port">Port</label>
                  <input
                    id="jf-first-port"
                    type="text"
                    inputmode="numeric"
                    placeholder="8096"
                  />
                </div>

                <div class="form-field" style="grid-column: 1 / -1">
                  <label for="jf-first-api-key">API Key</label>
                  <input
                    id="jf-first-api-key"
                    type="text"
                    autocomplete="off"
                    placeholder="Paste your API key"
                  />
                </div>

                <div
                  class="form-field"
                  style="grid-column: 1 / -1; margin-top: 0.5rem"
                >
                  <button type="button" id="jf-first-test-btn" class="btn">
                    Test Connection
                  </button>
                </div>
              </div>
            </div>

            <div class="page-navigation">
              <button type="button" class="btn btn-ghost" id="page2-prev">
                Back
              </button>
              <button type="button" class="btn" id="page2-next" disabled>
                Next
              </button>
            </div>
          </div>

          <div class="first-start-page" data-page="3">
            <div class="page-content">
              <div class="page-header">
                <h2>Select Libraries</h2>
              </div>

              <div class="server-info-display" id="server-info-display">
                <div class="info-row">
                  <span class="info-label">Server Name</span>
                  <span class="info-value" id="server-name-display">
                    Loading...
                  </span>
                </div>
                <div class="info-row">
                  <span class="info-label">Server Version</span>
                  <span class="info-value" id="server-version-display">
                    Loading...
                  </span>
                </div>
              </div>

              <div class="libraries-tracking" id="libraries-tracking">
                <h3>Available Libraries</h3>
                <div id="libraries-list"></div>
                <div
                  id="libraries-empty"
                  class="first-start-placeholder"
                  hidden
                >
                  No libraries found
                </div>
              </div>
            </div>

            <div class="page-navigation">
              <button type="button" class="btn btn-ghost" id="page3-prev">
                Back
              </button>
              <button type="button" class="btn" id="page3-finish">
                Finish Setup
              </button>
            </div>
          </div>

          <div class="first-start-page" data-page="sync">
            <div class="page-content" style="align-items: center">
              <div class="jf-sync-spinner"></div>
              <p id="jf-first-sync-text" style="margin: 0">
                Performing initial sync with Jellyfin
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="toast-container" class="toast-container" role="status"></div>

    <script src="../static/js/toast.js"></script>
    <script src="../static/js/first_start.js"></script>
  </body>
</html>
