<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borealis | User</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/borealis_small.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      {% include '_sidebar.html' %}
      <main id="content" class="content" tabindex="-1">
        <div class="row-1">
          <div class="user-info-column">
            <section id="hero-section" class="hero-section">
              <div class="hero-container">
                <img
                  src="/api/jellyfin/users/{{ user.jellyfin_id }}/images/primary"
                  alt="{{ user.name }}"
                  class="hero-image"
                  onerror="this.src = '/assets/icons/profile_small.png'"
                />
                <h1 class="hero-name">{{ user.name }}</h1>
                {% if user.is_admin %}
                <img
                  class="hero-admin"
                  src="../assets/icons/admin.svg"
                  alt="Administrator"
                  title="Administrator"
                />
                {% endif %}
              </div>

              <div class="glance-columns">
                <div class="glance-section">
                  <div class="glance-card" data-glance-key="total_plays">
                    <div class="glance-label">Total Plays</div>
                    <div class="glance-value" id="glance-total-plays"></div>
                  </div>
                  <div class="glance-card" data-glance-key="total_watch_time">
                    <div class="glance-label">Total Watch Time</div>
                    <div class="glance-value" id="glance-total-watch-time"></div>
                  </div>
                </div>

                <div class="glance-section right">
                  <div class="glance-card" data-glance-key="last_activity">
                    <div class="glance-label">Last Activity</div>
                    <div class="glance-value" id="glance-last-activity"></div>
                  </div>
                  <div class="glance-card" data-glance-key="favourite_item">
                    <div class="glance-label">Cool future statistic</div>
                    <div class="glance-value" id="glance-favourite-item"></div>
                  </div>
                </div>
              </div>
            </section>

            <section id="statistics-section" class="statistics-section">
              <h2>Watch Statistics</h2>

              <nav>
                <ul class="statistics-nav">
                  <li>Libraries</li>
                  <li>Items</li>
                  <li>Genres</li>
                </ul>
              </nav>

              <div class="watch-statistics-card">
                <div id="watch-statistics-loading" class="skeleton">
                  <div class="wrapper">
                    <div></div>
                  </div>
                </div>
                <canvas id="watch-statistics-chart"></canvas>
              </div>
            </section>

            <section class="plays-trend-section">
              <div class="plays-trend-card">
                <div
                  class="plays-trend-card-header"
                  id="plays-trend-card-header"
                  hidden
                >
                  <div id="plays-trend-total" class="plays-trend-card-value"></div>
                  <div class="plays-trend-card-label">Plays in last 14 days</div>
                </div>

                <div id="plays-trend-loading" class="skeleton">
                  <div class="wrapper">
                    <div></div>
                  </div>
                </div>
                <canvas id="plays-trend-chart"></canvas>
              </div>
            </section>
          </div>

          <section id="recent-section" class="recent-section">
            <div id="recent-activity-empty" class="recent-activity-placeholder" hidden>
              <p>No recent activity.</p>
            </div>
            <div id="recent-activity-container" hidden>
              <table class="recent-activity-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th class="align-right">Duration Watched</th>
                  </tr>
                </thead>
                <tbody id="recent-activity-tbody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="../static/js/toast.js"></script>
    <script type="application/json" id="user-data">
      {
        "total_plays": {{ user.total_plays | default(0) | int }},
        "total_watch_time_seconds": {{ user.total_watch_time_seconds | default(0) | int }},
        "last_seen_at": {{ user.last_seen_at | default(null) | tojson }}
      }
    </script>
    <script src="../static/js/site.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../static/js/user.js"></script>
  </body>
</html>
