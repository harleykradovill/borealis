<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borealis | User</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/borealis_small.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      {% include '_sidebar.html' %}
      <main id="content" class="content" tabindex="-1">
        <div class="row-1">
          <section id="hero-section" class="hero-section">
            <div class="hero-container">
              <img
                src="/api/jellyfin/users/{{ user.jellyfin_id }}/images/primary"
                alt="{{ user.name }}"
                class="hero-image"
                onerror="this.src = '/assets/icons/profile_small.png'"
              />
              <h1 class="hero-name">{{ user.name }}</h1>
            </div>
          </section>
          <section id="recent-section" class="recent-section">
            <h2>Recent Activity</h2>
          </section>
        </div>
      </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="../static/js/toast.js"></script>
    <script src="../static/js/user.js"></script>
    <script src="../static/js/site.js"></script>
  </body>
</html>
